<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="95" stroke="currentColor" stroke-width="4" fill="none"/>
  <!-- Inner Ring -->
  <circle cx="100" cy="100" r="85" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <!-- Steering Wheel / Globe Outline -->
  <circle cx="100" cy="100" r="55" stroke="currentColor" stroke-width="2" fill="none"/>
  <!-- Steering Wheel Spokes -->
  <line x1="100" y1="45" x2="100" y2="155" stroke="currentColor" stroke-width="3"/>
  <line x1="45" y1="100" x2="155" y2="100" stroke="currentColor" stroke-width="3"/>
  <!-- Text -->
  <text x="100" y="93" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="currentColor" text-anchor="middle" letter-spacing="4">FIA</text>
  <text x="100" y="122" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="currentColor" text-anchor="middle" letter-spacing="1">GOVERNANCE</text>
</svg>
